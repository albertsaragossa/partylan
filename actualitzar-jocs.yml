name: Actualitzar catàleg de Steam

on:
  schedule:
    - cron: "0 4 * * 1"   # cada dilluns a les 4:00 UTC
  workflow_dispatch:       # també es pot executar a mà des de la pestanya Actions

permissions:
  contents: write

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descarrega el catàleg
        run: node scripts/actualitza-jocs.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      - name: Desa els canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam-games.json
          git diff --cached --quiet || (git commit -m "Actualitza el catàleg de jocs de Steam" && git push)
